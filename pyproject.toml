[project]
name = "facetrace"
version = "1.0.0"
description = "FaceTrace - Face Identification & Blockchain Verification Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "web3>=6.15.0",
    "eth-account>=0.11.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "Pillow>=10.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
arcface = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
]
